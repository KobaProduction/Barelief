default_install_hook_types: [pre-push]
default_stages: [pre-push]
exclude: '^(libs/(dsp_kernels/vendor|bdsp_protocol/(vendor|generated))|adapters/desktop/resampling/vendor|tools/control_codegen/toolchain|output)/'
repos:
  - repo: local
    hooks:
      - id: quality-tools
        name: Quality-tool regression tests
        language: python
        additional_dependencies: [identify==2.6.20, clang-tidy==22.1.8]
        entry: python scripts/verify_quality_tools.py
        pass_filenames: false
        files: '^(\.pre-commit-config\.yaml|(?:tests/)?\.clang-tidy|\.github/workflows/.*\.ya?ml|scripts/(quality_(scope|execution|compile_context)(_tests)?|run_(clazy|clang_tidy)|verify_quality_tools)\.py|tests/(quality_execution|quality_compile_context|run_clazy|run_clang_tidy)_tests\.py)$'
      - id: checkdeps
        name: Chromium checkdeps (module boundaries)
        language: python
        entry: python scripts/vendor/chromium_checkdeps/checkdeps.py --root .
        pass_filenames: false
        always_run: true
      - id: clazy
        name: Clazy (production Qt C++)
        language: python
        entry: python scripts/run_clazy.py
        args: [-p=cmake-build-dev, --extra-arg=--target=x86_64-w64-windows-gnu]
        pass_filenames: false
        always_run: true
        require_serial: true
      - id: clang-tidy
        name: clang-tidy (production C++ function policy)
        language: python
        additional_dependencies: [clang-tidy==22.1.8]
        entry: python scripts/run_clang_tidy.py
        args: [-p=cmake-build-dev, --extra-arg-before=-xc++, --extra-arg-before=-std=c++23]
        pass_filenames: false
        always_run: true
        require_serial: true
      - id: clazy-tests
        name: clazy (test C++)
        stages: [manual]
        language: python
        entry: python scripts/run_clazy.py
        args: [--scope=full, --code-scope=tests, -p=cmake-build-dev, --extra-arg=--target=x86_64-w64-windows-gnu]
        pass_filenames: false
        always_run: true
        require_serial: true
      - id: clang-tidy-tests
        name: clang-tidy (test C++)
        stages: [manual]
        language: python
        additional_dependencies: [clang-tidy==22.1.8]
        entry: python scripts/run_clang_tidy.py
        args: [--scope=full, --code-scope=tests, -p=cmake-build-dev, --extra-arg-before=-xc++, --extra-arg-before=-std=c++23]
        pass_filenames: false
        always_run: true
        require_serial: true
