name: Strict function quality
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      test_lint:
        description: Run the separate C++ test lint pass
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  function-quality:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Install standard linters
        run: python -m pip install -r scripts/requirements-quality.txt
      - name: Quality-tool regression tests
        run: python -m pre_commit run quality-tools --all-files --hook-stage pre-push
      - name: Module boundaries
        run: python scripts/vendor/chromium_checkdeps/checkdeps.py --root .
      - name: Boundary regression checks
        run: python tests/checkdeps_tests.py
      - id: qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125
        with:
          version: '6.10.2'
          arch: win64_mingw
          modules: qtcharts qtdatavis3d qtserialport
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310 tools_qtcreator,qt.tools.qtcreator'
          aqtversion: '==3.3.0'
      - name: Prepare C++ compilation database
        shell: pwsh
        run: |
          $toolchain = Join-Path (Split-Path (Split-Path $env:QT_ROOT_DIR)) 'Tools/mingw1310_64/bin'
          $env:PATH = "$toolchain;$env:PATH"
          $env:QT_ROOT = $env:QT_ROOT_DIR
          cmake --preset release -DBUILD_QUALITY_HEADER_AUDIT=ON -DCMAKE_C_COMPILER="$toolchain/gcc.exe" -DCMAKE_CXX_COMPILER="$toolchain/g++.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset release --parallel 4
      - name: clang-tidy
        run: python -m pre_commit run clang-tidy --all-files --hook-stage pre-push
      - name: Clazy
        if: ${{ always() && steps.qt.outcome == 'success' }}
        shell: pwsh
        run: |
          $qtInstall = Split-Path (Split-Path $env:QT_ROOT_DIR)
          $env:CLAZY_STANDALONE = Join-Path $qtInstall 'Tools/QtCreator/bin/clang/bin/clazy-standalone.exe'
          python -m pre_commit run clazy --all-files --hook-stage pre-push
      - name: clang-tidy tests (opt-in separate result)
        if: ${{ always() && steps.qt.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.test_lint }}
        run: python -m pre_commit run clang-tidy-tests --all-files --hook-stage manual
      - name: Clazy tests (opt-in separate result)
        if: ${{ always() && steps.qt.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.test_lint }}
        shell: pwsh
        run: |
          $qtInstall = Split-Path (Split-Path $env:QT_ROOT_DIR)
          $env:CLAZY_STANDALONE = Join-Path $qtInstall 'Tools/QtCreator/bin/clang/bin/clazy-standalone.exe'
          python -m pre_commit run clazy-tests --all-files --hook-stage manual
