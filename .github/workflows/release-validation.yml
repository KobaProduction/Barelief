name: Release validation
on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified packages as a GitHub Release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: barelief-release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      releaseTag: ${{ steps.identity.outputs.releaseTag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Resolve immutable release identity
        id: identity
        run: python scripts/git_version.py --source . --require-clean --github-output "$GITHUB_OUTPUT"
  validate-and-package:
    needs: version
    uses: ./.github/workflows/windows.yml
    with:
      release_validation: true
  publish:
    needs: [version, validate-and-package]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/release') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: barelief-*-release
          merge-multiple: true
          path: ${{ runner.temp }}/barelief-release-packages
      - name: Verify source and all package identities
        id: packages
        run: python scripts/prepare_release.py --source . --packages "$RUNNER_TEMP/barelief-release-packages" --expected-commit "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.packages.outputs.releaseTag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; tags and assets are immutable: $RELEASE_TAG" >&2
            exit 1
          fi
          packages="$RUNNER_TEMP/barelief-release-packages"
          gh release create "$RELEASE_TAG" "$packages"/* --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file "$packages/release-notes.txt"
