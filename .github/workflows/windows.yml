name: Desktop and portable builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125
        with:
          version: '6.10.2'
          arch: win64_mingw
          modules: qtcharts qtdatavis3d qtserialport
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          aqtversion: '==3.3.0'
      - name: Configure
        run: |
          $toolchain = Join-Path (Split-Path (Split-Path $env:QT_ROOT_DIR)) 'Tools/mingw1310_64/bin'
          $toolchain >> $env:GITHUB_PATH
          $env:PATH = "$toolchain;$env:PATH"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DCMAKE_C_COMPILER="$toolchain/gcc.exe" -DCMAKE_CXX_COMPILER="$toolchain/g++.exe" -DBUILD_TESTING=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error -L 'quick|integration'
      - name: Verify deployment
        if: matrix.configuration == 'Release'
        run: cmake --install build --prefix dist

  portable:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        fft_size: [512, 1024, 2048, 4096]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure without Qt
        run: cmake -S . -B build -DBUILD_DSP_ONLY=ON -DPORTABLE_DSP_MAX_FFT_SIZE=${{ matrix.fft_size }} -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error -L dsp

  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gui: ['ON', 'OFF']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libpulse-dev pulseaudio pulseaudio-utils libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - name: Select supported Python for aqtinstall
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125
        with:
          version: '6.10.2'
          arch: linux_gcc_64
          modules: qtcharts qtdatavis3d qtserialport
          setup-python: 'false'
          aqtversion: '==3.3.0'
      - name: Virtual audio devices
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=qa rate=48000 channels=2
          pactl set-default-sink qa
          pactl set-default-source qa.monitor
      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DBUILD_GUI=${{ matrix.gui }} -DBUILD_TESTING=ON 2>&1 | tee linux-configure.log
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 4 2>&1 | tee linux-build.log
      - name: Package Linux installer
        if: matrix.gui == 'ON'
        run: |
          set -o pipefail
          mkdir -p packages
          cpack -G DEB --config build/CPackConfig.cmake -B packages 2>&1 | tee linux-package.log
          package=$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package" | grep -E '/bin/Barelief$'
      - name: Upload Linux installer
        if: matrix.gui == 'ON'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: barelief-linux-ubuntu-24.04
          path: packages/*.deb
          if-no-files-found: error
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_OPENGL: software
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --no-tests=error -L 'quick|integration' 2>&1 | tee linux-test.log
      - name: Verify PulseAudio virtual capture endpoints
        run: |
          pactl info
          pactl list short sinks | grep -F qa
          pactl list short sources | grep -F qa.monitor
      - name: Report Linux CI failure
        if: failure()
        run: |
          for file in linux-configure.log linux-build.log linux-package.log linux-test.log; do
            if test -f "$file"; then
              diagnostic=$(grep -E 'CMake Error|fatal error:|error:|FAILED:|CPack Error' "$file" | tail -5 | tr '\n' ' ' | cut -c 1-700 || true)
              if test -n "$diagnostic"; then
                echo "::error title=Linux diagnostics ($file)::$diagnostic"
              fi
            fi
          done
          if test -f linux-test.log; then
            failures=$(grep -E '\*\*\*Failed|\*\*\*Timeout|The following tests FAILED|Tests Failed' linux-test.log | tail -10 | tr '\n' ' ' | cut -c 1-700 || true)
            if test -n "$failures"; then
              echo "::error title=Linux CTest failures::$failures"
            fi
            for test in music_profile_tests console_config_tests; do
              if grep -Eq "${test}.*(\\*\\*\\*Failed|\\*\\*\\*Timeout)" linux-test.log; then
                details=$(awk -v test="$test" '$0 ~ "Testing: " test {inside=1} inside && /^Output:$/ {output=1; next} output && /<end of output>/ {exit} output {print}' build/Testing/Temporary/LastTest.log | tail -12 | tr '\n' ' ' | cut -c 1-750 || true)
                if test -n "$details"; then
                  echo "::error title=Linux $test output::$details"
                fi
              fi
            done
          fi
      - name: Upload Linux failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: barelief-linux-${{ matrix.gui }}-diagnostics
          path: |
            linux-configure.log
            linux-build.log
            linux-package.log
            linux-test.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
